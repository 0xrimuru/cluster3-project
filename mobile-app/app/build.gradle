plugins {
    id 'com.android.application'
}

android {
    namespace 'au.com.lpa.ecomms'
    compileSdk 34

    defaultConfig {
        applicationId "au.com.lpa.ecomms"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1-secure"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            // development: the PC running `npm start`, seen from the emulator
            buildConfigField "String", "APP_URL", '"http://10.0.2.2:3000/"'
        }
        release {
            // HTTPS only (change to the real server address for production)
            buildConfigField "String", "APP_URL", '"https://10.0.2.2:3000/"'
            minifyEnabled true          // R8: shrink + obfuscate the Java code
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Align Kotlin stdlib jdk7/jdk8 with the main stdlib to avoid duplicate
    // classes (appcompat brings kotlin-stdlib 1.8.22; the jdk7/jdk8 artifacts
    // were merged into it in Kotlin 1.8). Google's documented fix.
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'kotlin-stdlib-jdk7 is now part of kotlin-stdlib'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'kotlin-stdlib-jdk8 is now part of kotlin-stdlib'
        }
    }
}
